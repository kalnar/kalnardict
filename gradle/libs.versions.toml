[versions]
android-gradle-plugin = "9.1.1"
espresso-intents = "3.7.0"
kotlin = "2.3.21"
kotlin-plugins = "2.3.21"
ksp = "2.3.6"
google-services = "4.4.4"

coroutines = "1.10.2"
mockk-android = "1.14.9"
serialization-json = "1.11.0"

appcompat = "1.7.1"
core-ktx = "1.18.0"
fragment = "1.8.9"
preference = "1.2.1"
activity-compose = "1.13.0"

compose-bom = "2026.04.01"
compose = "1.11.0"
compose-runtime-livedata = "1.11.0"

navigation = "2.9.8"
room = "2.8.4"
lifecycle = "2.10.0"

koin = "4.2.1"
koin-legacy = "3.0.2"

firebase-appdistribution = "16.0.0-beta18"
firebase-appdistribution-gradle = "5.2.1"

material = "1.13.0"
material-dialogs = "3.3.0"
stetho = "1.6.0"
logger = "2.2.0"
commons-lang3 = "3.20.0"
compose-theme-adapter = "1.2.1"
flow-preferences = "1.3.0"

junit4 = "4.13.2"
hamcrest = "3.0"
mockito = "5.23.0"
mockito-kotlin = "6.3.0"
arch-core = "2.2.0"
jraska-livedata = "1.3.0"
junit-jupiter = "6.0.3"
androidx-test = "1.7.0"
core-ktx-version = "1.7.0"

[libraries]
# Build classpath
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "android-gradle-plugin" }
androidx-espresso-intents = { module = "androidx.test.espresso:espresso-intents", version.ref = "espresso-intents" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
mockk-android = { module = "io.mockk:mockk-android", version.ref = "mockk-android" }
navigation-safe-args-gradle-plugin = { group = "androidx.navigation", name = "navigation-safe-args-gradle-plugin", version.ref = "navigation" }
google-services-plugin = { group = "com.google.gms", name = "google-services", version.ref = "google-services" }

# Kotlin
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib-jdk7", version.ref = "kotlin" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization-json" }

# AndroidX Core
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-preference-ktx = { group = "androidx.preference", name = "preference-ktx", version.ref = "preference" }

# Compose (BOM-managed — no explicit version)
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-material-icons-core = { module = "androidx.compose.material:material-icons-core" }

# Compose (explicit versions)
compose-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata", version.ref = "compose-runtime-livedata" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
compose-material = { group = "androidx.compose.material", name = "material", version.ref = "compose" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "compose" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "compose" }

# Activity & Navigation
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-guava = { group = "androidx.room", name = "room-guava", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# Lifecycle
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Koin
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }
koin-test = { group = "io.insert-koin", name = "koin-test", version.ref = "koin" }
koin-core-ext = { group = "io.insert-koin", name = "koin-core-ext", version.ref = "koin-legacy" }
koin-android-ext = { group = "io.insert-koin", name = "koin-android-ext", version.ref = "koin-legacy" }

# Firebase
firebase-appdistribution = { group = "com.google.firebase", name = "firebase-appdistribution", version.ref = "firebase-appdistribution" }
firebase-appdistribution-gradle = { group = "com.google.firebase", name = "firebase-appdistribution-gradle", version.ref = "firebase-appdistribution-gradle" }

# Material & UI
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
google-compose-theme-adapter = { group = "com.google.android.material", name = "compose-theme-adapter", version.ref = "compose-theme-adapter" }
material-dialogs-core = { group = "com.afollestad.material-dialogs", name = "core", version.ref = "material-dialogs" }
orhanobut-logger = { group = "com.orhanobut", name = "logger", version.ref = "logger" }
commons-lang3 = { group = "org.apache.commons", name = "commons-lang3", version.ref = "commons-lang3" }
stetho = { group = "com.facebook.stetho", name = "stetho", version.ref = "stetho" }
flow-preferences = { group = "com.github.tfcporciuncula", name = "flow-preferences", version.ref = "flow-preferences" }

# Testing
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
hamcrest = { group = "org.hamcrest", name = "hamcrest", version.ref = "hamcrest" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockito-kotlin" }
androidx-arch-core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "arch-core" }
jraska-livedata-testing-ktx = { group = "com.jraska.livedata", name = "testing-ktx", version.ref = "jraska-livedata" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit-jupiter" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidx-test" }
support-test-rules = { group = "com.android.support.test", name = "rules", version = "1.0.2" }
core-ktx = { group = "androidx.test", name = "core-ktx", version.ref = "core-ktx-version" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin-plugins" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-plugins" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
navigation-safeargs-kotlin = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
firebase-appdistribution-gradle = { id = "com.google.firebase.appdistribution", version.ref = "firebase-appdistribution-gradle" }

[bundles]
compose-bom-impl = ["compose-ui", "compose-ui-tooling-preview", "compose-material3"]
compose-extra = [
    "compose-foundation",
    "compose-material",
]
room = ["androidx-room-runtime", "androidx-room-ktx"]
koin-base = ["koin-core", "koin-android"]
coroutines = ["kotlinx-coroutines-core", "kotlinx-coroutines-android"]
