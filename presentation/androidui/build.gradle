apply plugin: 'com.android.library'
apply plugin: "androidx.navigation.safeargs.kotlin"
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: "org.jetbrains.kotlin.plugin.serialization"

android {
    compileSdkVersion 31

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 33

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    flavorDimensions "version"
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    productFlavors {
        mock
        full
    }

    buildFeatures {
        compose true
        viewBinding true
    }
    composeOptions {
        kotlinCompilerExtensionVersion "1.5.8"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            // TODO: why de we need to do this ? two libraries seem to include the same files
            excludes += 'win32-x86-64/attach_hotspot_windows.dll'
            excludes += 'win32-x86/attach_hotspot_windows.dll'
            excludes += 'META-INF/licenses/ASM'
        }
    }
    namespace 'eu.kalnarapps.kalnardict.androidui'

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation project(":core:common")
    implementation project(":presentation")
    implementation project(":platform:android:common")
    testImplementation project(":core:test")
    mockImplementation project(path: ':core:domain')

    // https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    implementation("org.apache.commons:commons-lang3:3.12.0")

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.core:core-ktx:1.7.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'

    // ui testing
    androidTestImplementation 'androidx.test:runner:1.4.0'
    androidTestImplementation 'androidx.test:rules:1.4.0'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.0-alpha02'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation "androidx.recyclerview:recyclerview:1.1.0"

    // latest stable
    def koin_version = '4.2.1'
    implementation "io.insert-koin:koin-core:$koin_version"
    // Koin extended & experimental features
    implementation "io.insert-koin:koin-core-ext:3.0.2"
    implementation("io.insert-koin:koin-androidx-compose:4.2.1")

    // Koin for Unit tests
    testImplementation "io.insert-koin:koin-test:$koin_version"
    implementation "io.insert-koin:koin-android:$koin_version"
    implementation "io.insert-koin:koin-android-ext:3.0.2"

    def nav_version = "2.3.0"
    implementation "androidx.fragment:fragment:1.3.0-alpha06"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"

    // coroutines for test
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.3.6'

    def lifecycle_version = "2.4.1"
    // LiveData
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"

    // livedata testing
    testImplementation 'androidx.arch.core:core-testing:2.1.0'
    testImplementation 'com.jraska.livedata:testing-ktx:1.3.0'

    // unit test libraries
    testImplementation group: 'org.hamcrest', name: 'hamcrest', version: '2.2'
    testImplementation('junit:junit:4.12') {
        exclude group: 'org.hamcrest', module: 'hamcrest-core'
    }

    // ui
    implementation 'com.google.android.material:material:1.1.0'
    implementation "com.afollestad.material-dialogs:core:3.1.0"


    // logging
    implementation 'com.orhanobut:logger:2.2.0'

    // mock libraries
    testImplementation 'org.mockito:mockito-core:3.9.0'
    testImplementation "org.mockito.kotlin:mockito-kotlin:4.0.0"

    // compose
    def composeBom = platform('androidx.compose:compose-bom:2026.03.01')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.navigation:navigation-compose:2.9.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0")

    def composeVersion = "1.2.0-alpha08"

    implementation "androidx.compose.foundation:foundation:$composeVersion"
    // Material Design
    implementation "androidx.compose.material:material:$composeVersion"
    // Material design icons
    implementation "androidx.compose.material:material-icons-core:$composeVersion"
    implementation "androidx.compose.material:material-icons-extended:$composeVersion"
    // Integration with activities
    implementation 'androidx.activity:activity-compose:1.4.0'
    // Integration with ViewModels
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.4.1'
    // Integration with observables
    implementation "androidx.compose.runtime:runtime-livedata:$composeVersion"
    implementation "androidx.compose.runtime:runtime-rxjava2:$composeVersion"
    // When using a MDC theme
    // https://mvnrepository.com/artifact/com.google.android.material/compose-theme-adapter
    implementation "com.google.android.material:compose-theme-adapter:1.1.7"

    // Test rules and transitive dependencies:
    // UI Tests
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$composeVersion"
    // Needed for createComposeRule, but not createAndroidComposeRule:
    androidTestImplementation("androidx.compose.ui:ui-test-manifest:$composeVersion")
}
